name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  astrbot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_fastbrain_proactive
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv venv
      - run: uv pip install 'astrbot==4.29.4' 'pytest>=8,<10' 'pytest-asyncio>=0.25,<2'
      - run: .venv/bin/python -m pytest --asyncio-mode=auto -q astrbot_plugin_fastbrain_proactive/tests
